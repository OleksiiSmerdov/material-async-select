<div class="container">
  <mat-form-field>
    <mat-label>Select user</mat-label>
    <mat-select
      [formControl]="userControl"
      (openedChange)="$event && usersStore.load()"
    >
      @if (!usersStore.entities().length) {
      <mat-option disabled>Loading...</mat-option>
      } @else {
      @for (user of usersStore.entities(); track user.id) {
      <mat-option [value]="user.id">{{ user.username }}</mat-option>
      }
      }
    </mat-select>
    @if (usersStore.isLoading()) {
    <mat-spinner [diameter]="16" matSuffix></mat-spinner>
    }
    <!--@if (usersStore.error()) {-->
    <mat-error>Error: {{ usersStore.error() }}</mat-error>
    <!--}-->
  </mat-form-field>
  <button type="button" matButton color="primary" (click)="reset()">
    Reset
  </button>
</div>
